name: conference_staff
description: رویداد یار (Roydadyar) — اپ نیروهای اجرایی روز کنفرانس — پذیرش، ثبت‌نام در محل و پذیرایی، آفلاین.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  mobile_scanner: '>=7.0.0 <8.0.0'
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  # فونت وزیرمتن (OFL) در CI از مخزن رسمی دانلود و اینجا گذاشته می‌شود تا روی همه‌ی گوشی‌ها یکسان باشد.
  # وزن ۵۰۰ و ۷۰۰ به نزدیک‌ترین وزن موجود می‌رسد.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
