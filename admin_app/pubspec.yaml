name: conference_admin
description: رویداد یار (Roydadyar) — اپ مدیریت کنفرانس برای ویندوز — ورود اکسل، ساخت کارت و PDF، تنظیم رویداد و گزارش.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  excel: ^4.0.6
  file_picker: '>=8.1.2 <11.0.0'
  pdf: ^3.11.1
  # قفل اپ مدیریت روی گوشی با اثر انگشت یا رمز گوشی (M1). فقط پیاده‌سازی اندروید،
  # چون پلاگین ویندوزِ local_auth با MSVC تازه کامپایل نمی‌شود و روی ویندوز قفل لازم نیست.
  local_auth_android: ^1.0.46
  local_auth_platform_interface: ^1.0.10
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # فونت وزیرمتن (OFL) در CI از مخزن رسمی دانلود و اینجا گذاشته می‌شود.
  assets:
    - assets/fonts/
    - assets/brand/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
