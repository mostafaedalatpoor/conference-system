name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  # بعد از باز شدن bundle، ساخت خودکار اجرا شود.
  workflow_run:
    workflows: [bootstrap]
    types: [completed]

jobs:
  staff-apk:
    name: اپ اندروید نیروها
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"
          done
          ls -la assets/fonts

      - name: ساخت پوشه‌ی اندروید
        run: |
          flutter create --org ir.newvisionteam --project-name conference_staff --platforms=android .
          rm -rf test
          python3 ci/patch_android.py android/app/src/main/AndroidManifest.xml

      # کلید امضای ثابت: نسخه‌های بعدی روی نسخه‌ی قبلی نصب می‌شوند و داده‌ی گوشی پاک نمی‌شود.
      - name: کلید امضا
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: staff-apk
          path: |
            staff_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            staff_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  admin-windows:
    name: اپ مدیریت ویندوز
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin_app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold Bold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"
          done
          ls -la assets/fonts

      - name: ساخت پوشه‌ی ویندوز
        run: |
          flutter create --org ir.newvisionteam --project-name conference_admin --platforms=windows .
          rm -rf test
          sed -i 's/L"conference_admin"/L"Conference Admin"/' windows/runner/main.cpp

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: admin-windows
          path: admin_app/build/windows/x64/runner/Release/
