name: build

# رویدادیار: اپ نیروها و اپ مدیریت، هر کدام روی اندروید و ویندوز.
on:
  push:
    branches: [main, design-system-daftar]
  workflow_dispatch:
  # بعد از باز شدن bundle، ساخت خودکار اجرا شود.
  workflow_run:
    workflows: [bootstrap]
    types: [completed]

env:
  VAZIRMATN: https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf

jobs:
  staff-android:
    name: رویدادیار نیروها — اندروید
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" "$VAZIRMATN/Vazirmatn-$w.ttf"
          done

      - name: ساخت پوشه‌ی اندروید
        run: |
          flutter create --org ir.newvisionteam --project-name conference_staff --platforms=android .
          rm -rf test
          python3 ../ci/patch_android.py android --label "رویدادیار نیروها"
          cp -r ../branding/android/mipmap-* android/app/src/main/res/

      # کلید امضای ثابت: نسخه‌های بعدی روی نسخه‌ی قبلی نصب می‌شوند و داده‌ی گوشی پاک نمی‌شود.
      - name: کلید امضا
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: roydadyar-staff-android
          path: |
            staff_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            staff_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  staff-windows:
    name: رویدادیار نیروها — ویندوز
    runs-on: windows-latest
    defaults:
      run:
        working-directory: staff_app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" "$VAZIRMATN/Vazirmatn-$w.ttf"
          done

      - name: ساخت پوشه‌ی ویندوز
        run: |
          flutter create --org ir.newvisionteam --project-name conference_staff --platforms=windows .
          rm -rf test
          python ../ci/patch_windows.py windows --binary RoydadYarStaff --title "رویدادیار نیروها" --icon ../branding/windows/app_icon.ico

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: roydadyar-staff-windows
          path: staff_app/build/windows/x64/runner/Release/

  admin-windows:
    name: رویدادیار مدیریت — ویندوز
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin_app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold Bold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" "$VAZIRMATN/Vazirmatn-$w.ttf"
          done

      - name: ساخت پوشه‌ی ویندوز
        run: |
          flutter create --org ir.newvisionteam --project-name conference_admin --platforms=windows .
          rm -rf test
          python ../ci/patch_windows.py windows --binary RoydadYarAdmin --title "رویدادیار مدیریت" --icon ../branding/windows/app_icon.ico

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: roydadyar-admin-windows
          path: admin_app/build/windows/x64/runner/Release/

  admin-android:
    name: رویدادیار مدیریت — اندروید
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: فونت وزیرمتن (OFL)
        run: |
          mkdir -p assets/fonts
          for w in Regular SemiBold Bold ExtraBold; do
            curl -fsSL -o "assets/fonts/Vazirmatn-$w.ttf" "$VAZIRMATN/Vazirmatn-$w.ttf"
          done

      - name: ساخت پوشه‌ی اندروید
        run: |
          flutter create --org ir.newvisionteam --project-name conference_admin --platforms=android .
          rm -rf test
          python3 ../ci/patch_android.py android --label "رویدادیار مدیریت" --biometric
          cp -r ../branding/android/mipmap-* android/app/src/main/res/

      - name: کلید امضا
        run: |
          mkdir -p ~/.android
          cp ../staff_app/ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: roydadyar-admin-android
          path: |
            admin_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            admin_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  wp-plugin:
    name: رویدادیار — افزونه‌ی وردپرس
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: بررسی نحو PHP
        run: |
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      # conference-day.zip پوشه‌ی conference-day را در ریشه دارد و همان را در وردپرس بارگذاری کنید
      # تا جای نسخه‌ی قبلی بنشیند.
      - name: ساخت zip افزونه
        run: |
          cd wp-plugin
          zip -r ../conference-day.zip conference-day

      - uses: actions/upload-artifact@v4
        with:
          name: roydadyar-wp-plugin
          path: conference-day.zip
